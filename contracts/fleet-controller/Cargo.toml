[package]
name = "fleet-controller"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false
description = "FLEET controller v0.3: native NEAR account key-lifecycle control plane"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
borsh = "1.8.1"
near-sdk = "=5.29.1"
near-sdk-env = "=0.1.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
overflow-checks = true
