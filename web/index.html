<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<title>Keyhalt console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" id="brand-home" href="#/keyhalt" aria-label="Home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><circle cx="12" cy="15.5" r=".75" fill="currentColor"/></svg>
    <span class="wordmark" id="brand-mark"></span>
  </a>
  <nav class="nav" aria-label="Screens">
    <a href="#/keyhalt" data-nav="keyhalt">Keyhalt</a>
    <a href="#/timeline" data-nav="timeline">Timeline</a>
  </nav>
  <span class="net" id="net">
    <span class="net-label">testnet</span>
    <span class="net-sep" aria-hidden="true">·</span>
    <span class="net-label">block</span>
    <span class="tick mono" id="block">…</span>
  </span>
</header>

<div class="banner" id="banner" role="status" aria-live="polite" hidden></div>

<main id="main">
  <section class="view" id="view-keyhalt" aria-labelledby="keyhalt-heading">
    <h1 id="keyhalt-heading" class="sr-only">Keyhalt</h1>
    <div class="panel" id="keyhalt-panel">
      <div class="panel-head">
        <span class="panel-title">Keyhalt</span>
        <span class="meta mono" id="keyhalt-meta">reading…</span>
      </div>
      <div id="keyhalt-body" aria-busy="true">
        <div class="skeleton-table" aria-hidden="true">
          <span class="skeleton skeleton-wide"></span>
          <span class="skeleton"></span>
          <span class="skeleton skeleton-wide"></span>
          <span class="skeleton"></span>
          <span class="skeleton skeleton-wide"></span>
          <span class="skeleton"></span>
        </div>
      </div>
    </div>
    <p class="more"><a href="#/timeline" class="more-link">Timeline <span aria-hidden="true">→</span></a></p>
  </section>

  <section class="view" id="view-agent" hidden>
    <p class="back"><a href="#/keyhalt" class="back-link">← Keyhalt</a></p>
    <h1 class="agent-id mono" id="agent-heading">Agent</h1>
    <div id="agent-status" class="status-strip" aria-live="polite"></div>
    <section class="panel" aria-labelledby="operators-heading">
      <div class="panel-head">
        <h2 id="operators-heading" class="panel-title">Operator keys</h2>
        <span class="meta mono" id="keys-meta">…</span>
      </div>
      <div class="table-wrap"><table class="keys-table" id="keys-table" aria-describedby="keys-meta">
        <caption class="sr-only">Operator keys for this agent</caption>
        <thead><tr><th scope="col">Key</th><th scope="col">Tag</th><th scope="col">From</th></tr></thead>
        <tbody id="keys-body"></tbody>
      </table></div>
      <div class="roles" id="roles"></div>
    </section>

    <section class="panel" aria-labelledby="admin-heading">
      <div class="panel-head">
        <h2 id="admin-heading" class="panel-title">Admin</h2>
        <span class="meta mono" id="admin-meta"></span>
      </div>
      <div id="admin-rows" class="admin-rows"></div>
    </section>

    <section class="panel" aria-labelledby="audit-heading">
      <div class="panel-head">
        <h2 id="audit-heading" class="panel-title">Audit</h2>
        <span class="meta mono" id="audit-meta">…</span>
      </div>
      <ol class="chain" id="audit-chain"></ol>
    </section>

    <section class="panel" aria-labelledby="events-heading">
      <div class="panel-head">
        <h2 id="events-heading" class="panel-title">Events</h2>
        <a class="meta mono link" href="#/timeline" id="all-events-link">all events →</a>
      </div>
      <div id="agent-events"></div>
    </section>

  </section>

  <section class="view" id="view-timeline" hidden>
    <p class="back"><a href="#/keyhalt" class="back-link">← Keyhalt</a></p>
    <div class="panel">
      <div class="panel-head">
        <h1 id="timeline-heading" class="panel-title">Timeline</h1>
        <span class="meta mono" id="timeline-meta">reading…</span>
      </div>
      <div id="timeline-body" aria-busy="true">
        <div class="skeleton-table" aria-hidden="true">
          <span class="skeleton skeleton-wide"></span><span class="skeleton"></span>
          <span class="skeleton skeleton-wide"></span><span class="skeleton"></span>
          <span class="skeleton skeleton-wide"></span><span class="skeleton"></span>
        </div>
      </div>
    </div>
  </section>
<div class="sheet" id="command-sheet" hidden>
  <code class="mono" id="command-text"></code>
  <div class="row">
    <button class="btn btn-copy" id="copy-command" type="button">Copy</button>
    <span class="copied" id="copy-status" role="status" aria-live="polite" hidden>Copied</span>
  </div>
</div>

</main>

<footer class="foot">
  <span class="foot-item">Verified <a href="/claims.md" id="claims-link" class="link">—</a></span>
  <span aria-hidden="true" class="foot-sep">·</span>
  <a href="/threat-model.md" class="link">Threat model</a>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
