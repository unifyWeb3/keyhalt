name: integration

# near-workspaces integration tests on x64.
# The local host is arm64 and near-workspaces cannot run there; this
# workflow is the integration pass source. Sandbox only: no testnet, no
# mainnet, no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix integrations/js ci --no-audit --no-fund

      - name: Build the sandbox wasm
        run: ./scripts/build-sandbox-wasm.sh

      - name: Run integration tests
        run: npm --prefix integrations/js test
