name: mutation

# Automated mutation testing with cargo-mutants on x64.
# The local host is arm64, so this workflow is the score source.
# Runs only on manual dispatch to avoid surprising runner usage.
#
# The differential property test is shortened for this run (the published
# run uses 3 seeds x 5,000 steps; see docs/INVARIANTS.md). Every other test
# runs unchanged. The effective property length is printed by the test.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target
      FLEET_PROPERTY_STEPS: "20"
      FLEET_PROPERTY_SEEDS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned cargo-mutants (prebuilt x86_64 tarball)
        run: |
          curl -fsSL -o cm.tar.gz \
            https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  cm.tar.gz" | sha256sum -c -
          tar -xzf cm.tar.gz
          sudo install -m 0755 cargo-mutants /usr/local/bin/cargo-mutants
          cargo mutants --version
          cargo mutants --help > mutants-help.txt 2>&1 || true

      - name: Run mutation tests on the controller
        run: |
          set -uo pipefail
          # cargo-mutants v27 writes its report to ./mutants.out (the
          # --output flag is the parent directory of that folder, so the
          # default is used here).
          nohup cargo mutants -p fleet-controller \
            --jobs 4 \
            --timeout-multiplier 4 \
            --minimum-test-timeout 30 \
            > mutants.stdout.txt 2>&1 &
          echo $! > mutants.pid
          for i in $(seq 1 60); do
            sleep 240
            if ! kill -0 "$(cat mutants.pid)" 2>/dev/null; then
              break
            fi
            echo "snapshot ${i}"
            cp -r mutants.out "mutants.snapshot.${i}" 2>/dev/null || true
            cp mutants.stdout.txt "mutants.snapshot.${i}.stdout.txt" 2>/dev/null || true
          done
          wait "$(cat mutants.pid)" || true
          tail -n 80 mutants.stdout.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-report
          path: |
            mutants.out/
            mutants.stdout.txt
            mutants.snapshot.*/
            mutants.snapshot.*.stdout.txt
          if-no-files-found: warn
